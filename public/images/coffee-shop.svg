<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="水墨小景：月洞窗前，一案清供">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f3e7"/>
      <stop offset="55%" stop-color="#f3ecdc"/>
      <stop offset="100%" stop-color="#ece2ce"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6dcc6"/>
      <stop offset="100%" stop-color="#f6f1e4"/>
    </linearGradient>
    <clipPath id="win"><circle cx="212" cy="168" r="100"/></clipPath>
  </defs>

  <rect width="800" height="420" fill="url(#paper)"/>
  <!-- 墙面（略暖于纸底，示意室内） -->
  <rect width="800" height="420" fill="#efe7d5" opacity=".45"/>

  <!-- ===================== 月洞窗（窗外景） ===================== -->
  <g clip-path="url(#win)">
    <rect x="112" y="68" width="200" height="200" fill="url(#sky)"/>
    <!-- 远山两层 -->
    <path d="M112 196c26-24 46-34 70-29 20 4 32 17 50 19 24 3 40-17 66-15v106H112z"
          fill="#2b2721" opacity=".15"/>
    <path d="M112 220c32-14 54-18 78-11 22 6 38 15 58 13 20-2 32-11 50-9v82H112z"
          fill="#2b2721" opacity=".09"/>
    <!-- 淡月 -->
    <circle cx="268" cy="112" r="14" fill="#e3d2aa" opacity=".75"/>
    <!-- 竹三竿 -->
    <g stroke="#2b2721" fill="none" stroke-linecap="round" opacity=".4">
      <path d="M176 268c5-52 3-96-1-134" stroke-width="3"/>
      <path d="M212 268c3-58 0-104-4-142" stroke-width="2.4"/>
      <path d="M250 268c-2-50-5-92-9-126" stroke-width="1.8"/>
    </g>
    <!-- 竹叶 -->
    <g fill="#2b2721" opacity=".34">
      <path d="M174 148c-15-8-26-6-32 3 11 5 24 4 32-3z"/>
      <path d="M175 176c-17 1-26 9-28 19 13 1 23-7 28-19z"/>
      <path d="M211 140c13-10 25-10 34-2-11 8-24 9-34 2z"/>
      <path d="M212 184c16-5 27-2 33 8-13 5-26 1-33-8z"/>
      <path d="M248 154c-14-7-24-5-30 4 10 4 22 3 30-4z"/>
      <path d="M251 198c13-8 24-7 31 1-10 7-22 7-31-1z"/>
    </g>
  </g>
  <!-- 窗框 -->
  <circle cx="212" cy="168" r="100" fill="none" stroke="#2b2721" stroke-width="3.2" opacity=".5"/>
  <circle cx="212" cy="168" r="105.5" fill="none" stroke="#2b2721" stroke-width="1" opacity=".18"/>

  <!-- ===================== 案（书桌） ===================== -->
  <rect x="0" y="294" width="800" height="9" fill="#2b2721" opacity=".34"/>
  <rect x="0" y="303" width="800" height="2.5" fill="#2b2721" opacity=".16"/>
  <rect x="52" y="305" width="10" height="115" fill="#2b2721" opacity=".16"/>
  <rect x="738" y="305" width="10" height="115" fill="#2b2721" opacity=".16"/>

  <!-- 书卷三叠 -->
  <g opacity=".5" fill="none" stroke="#2b2721" stroke-width="1.7">
    <rect x="322" y="281" width="150" height="9" rx="4.5"/>
    <rect x="330" y="270" width="134" height="9" rx="4.5"/>
    <rect x="338" y="259" width="118" height="9" rx="4.5"/>
    <path d="M398 259v31" stroke="#a32e26" stroke-width="1.5" opacity=".65"/>
  </g>

  <!-- 茶盏 -->
  <g>
    <path d="M548 272c0 15 12 24 28 24s28-9 28-24z" fill="#faf6ec" opacity=".85"/>
    <path d="M548 272c0 15 12 24 28 24s28-9 28-24" fill="none" stroke="#2b2721" stroke-width="2.2" opacity=".55"/>
    <ellipse cx="576" cy="272" rx="28" ry="5.5" fill="#a98a5e" opacity=".3"/>
    <path d="M540 296h72" stroke="#2b2721" stroke-width="2" opacity=".35" stroke-linecap="round"/>
    <path d="M568 258c6-9-4-14 1-22M584 256c5-10-4-15 1-24"
          fill="none" stroke="#2b2721" stroke-width="1.5" opacity=".17" stroke-linecap="round"/>
  </g>

  <!-- 笔筒与三管笔 -->
  <g>
    <path d="M652 294v-26h46v26z" fill="#faf6ec" opacity=".6"/>
    <path d="M652 268h46" stroke="#2b2721" stroke-width="2" opacity=".5"/>
    <path d="M652 294v-26M698 294v-26M652 294h46" stroke="#2b2721" stroke-width="1.8" opacity=".45" fill="none"/>
    <g opacity=".55" fill="#2b2721">
      <!-- 笔一 -->
      <g transform="translate(664,268)">
        <rect x="-1.3" y="-24" width="2.6" height="24" rx="1.3"/>
        <path d="M-1.3-24L0-36l1.3 12z" opacity=".8"/>
      </g>
      <!-- 笔二 -->
      <g transform="translate(675,268) rotate(-6)">
        <rect x="-1.3" y="-30" width="2.6" height="30" rx="1.3"/>
        <path d="M-1.3-30L0-43l1.3 13z" opacity=".8"/>
      </g>
      <!-- 笔三 -->
      <g transform="translate(687,268) rotate(5)">
        <rect x="-1.3" y="-21" width="2.6" height="21" rx="1.3"/>
        <path d="M-1.3-21L0-32l1.3 11z" opacity=".8"/>
      </g>
    </g>
  </g>

  <!-- 朱砂闲印 -->
  <g>
    <rect x="736" y="262" width="30" height="30" rx="2" fill="#a32e26" opacity=".88"/>
    <rect x="739.5" y="265.5" width="23" height="23" rx="1" fill="none" stroke="#f8f3e7" stroke-width="1.4" opacity=".68"/>
    <path d="M746 274h10M746 281h10M751 274v13" stroke="#f8f3e7" stroke-width="1.3" opacity=".78" stroke-linecap="round"/>
  </g>

  <!-- ===================== 右侧垂枝老梅 ===================== -->
  <g>
    <path d="M800 6c-52 12-88 42-114 80-16 24-25 50-28 78"
          fill="none" stroke="#2b2721" stroke-width="3.4" opacity=".38" stroke-linecap="round"/>
    <path d="M722 62c-18-4-32 1-42 13 16 5 32 0 42-13z" fill="#2b2721" opacity=".16"/>
    <path d="M690 116c-17-2-30 5-36 18 16 3 29-4 36-18z" fill="#2b2721" opacity=".16"/>
    <path d="M666 170c-15-1-26 5-31 16 14 3 25-3 31-16z" fill="#2b2721" opacity=".14"/>

    <!-- 五瓣梅 -->
    <g fill="#a32e26">
      <g transform="translate(722,62) scale(.92)">
        <circle cx="0" cy="-4" r="3.4"/><circle cx="3.8" cy="-1.2" r="3.4"/>
        <circle cx="2.4" cy="3.3" r="3.4"/><circle cx="-2.4" cy="3.3" r="3.4"/>
        <circle cx="-3.8" cy="-1.2" r="3.4"/>
        <circle cx="0" cy="0" r="1.3" fill="#f8f3e7"/>
      </g>
      <g transform="translate(690,116) scale(.86)">
        <circle cx="0" cy="-4" r="3.4"/><circle cx="3.8" cy="-1.2" r="3.4"/>
        <circle cx="2.4" cy="3.3" r="3.4"/><circle cx="-2.4" cy="3.3" r="3.4"/>
        <circle cx="-3.8" cy="-1.2" r="3.4"/>
        <circle cx="0" cy="0" r="1.3" fill="#f8f3e7"/>
      </g>
      <g transform="translate(666,170) scale(.94)">
        <circle cx="0" cy="-4" r="3.4"/><circle cx="3.8" cy="-1.2" r="3.4"/>
        <circle cx="2.4" cy="3.3" r="3.4"/><circle cx="-2.4" cy="3.3" r="3.4"/>
        <circle cx="-3.8" cy="-1.2" r="3.4"/>
        <circle cx="0" cy="0" r="1.3" fill="#f8f3e7"/>
      </g>
      <!-- 未开的花苞 -->
      <circle cx="748" cy="34" r="3.6" opacity=".72"/>
      <circle cx="646" cy="204" r="3.2" opacity=".6"/>
    </g>
  </g>
</svg>
